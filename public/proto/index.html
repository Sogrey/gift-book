<!DOCTYPE html>
<html lang="zh-CN" data-theme="red">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>电子礼簿 · 留影轮播原型</title>
<style>
  /* ============ 主题 ============ */
  :root, [data-theme='red'] {
    --primary: #b91c1c; --primary-deep: #7f1d1d; --soft: #f3dede;
    --accent: #c9a063; --bg: #faf3ef; --ink: #45201c; --ink-soft: #8a6259;
    --card: #fff;
  }
  [data-theme='white'] {
    --primary: #475569; --primary-deep: #334155; --soft: #e2e6ec;
    --accent: #94a3b8; --bg: #f2f4f6; --ink: #1f2937; --ink-soft: #6b7280;
    --card: #f5f6f8;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    transition: background .4s;
  }
  .kai { font-family: 'KaiTi','STKaiti','楷体',serif; }

  /* ============ 顶栏 ============ */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 10px 14px; background: rgba(255,255,255,.9); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--soft);
  }
  header h1 { font-size: 16px; color: var(--primary); margin-right: 10px; white-space: nowrap; }
  .tab {
    padding: 6px 12px; font-size: 13px; border: 1px solid var(--soft); border-radius: 8px;
    background: #fff; color: var(--ink-soft); cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .tab:hover { border-color: var(--primary); color: var(--primary); }
  .tab.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .auto { margin-left: auto; font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .auto button { padding: 4px 10px; font-size: 12px; border: 1px solid var(--soft); border-radius: 999px; background: #fff; color: var(--ink-soft); cursor: pointer; }
  .auto button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .theme-sw { font-size: 12px; padding: 4px 10px; border: 1px solid var(--soft); border-radius: 999px; background: #fff; color: var(--ink-soft); cursor: pointer; }

  /* ============ 舞台 ============ */
  main { height: 100vh; padding-top: 58px; position: relative; }
  .scene { position: absolute; top: 58px; left: 0; right: 0; bottom: 0; display: none; overflow: hidden; }
  .scene.on { display: block; }
  .scene-tag {
    position: absolute; left: 14px; bottom: 12px; z-index: 50; font-size: 12px; color: var(--ink-soft);
    background: rgba(255,255,255,.75); padding: 4px 10px; border-radius: 999px; pointer-events: none;
  }

  /* ============ 1. 拍立得甩卡 ============ */
  #s-polaroid { background: linear-gradient(160deg, var(--bg), #fdf0e8); }
  .polaroid-card {
    position: absolute; top: 12%; left: 50%; transform: translate(-50%, 0); width: min(300px, 32vw); background: #fff;
    padding: 12px 12px 46px; box-shadow: 0 14px 36px rgba(69,32,28,.28); cursor: default;
  }
  /* 动画保险：若系统关闭动画导致 keyframes 冻结，静态位置仍在屏幕中央 */
  .polaroid-card img { width: 100%; height: auto; display: block; object-fit: cover; }
  .polaroid-card .cap { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 17px; color: var(--ink); }
  .polaroid-card.throw {
    animation: throw-in .55s cubic-bezier(.22,1.2,.36,1) both;
  }
  @keyframes throw-in {
    0% { transform: translate(70vw, -30vh) rotate(24deg); opacity: 0; }
    60% { transform: translate(-4%, 0) rotate(-2deg); opacity: 1; }
    100% { transform: translate(-50%, 0) rotate(-2deg); }
  }
  .polaroid-card.settle { animation: settle .7s ease-in both; }
  @keyframes settle {
    0% { transform: translate(-50%,0) rotate(-2deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(.42); opacity: .96; }
  }
  .polaroid-card.settled { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(.42); opacity: .96; }

  /* ============ 2. 胶片流 ============ */
  #s-film { background: #17110f; }
  .film-strip { position: absolute; top: 50%; left: 0; width: max-content; transform: translateY(-50%); display: flex; }
  .film-half { display: flex; animation: film-move 26s linear infinite; }
  .film-cell { width: 208px; margin: 0 10px; background: #0d0a09; border-radius: 4px; padding: 16px 0; position: relative; }
  .film-cell::before, .film-cell::after {
    content: ''; position: absolute; left: 8px; right: 8px; height: 10px;
    background-image: radial-gradient(circle 4px, #f5efe8 45%, transparent 50%);
    background-size: 16px 10px; background-repeat: repeat-x;
  }
  .film-cell::before { top: 3px; } .film-cell::after { bottom: 3px; }
  .film-cell img { display: block; width: 176px; height: 132px; margin: 0 auto; object-fit: cover; border-radius: 2px; }
  .film-cell .who { margin-top: 9px; text-align: center; color: #f0e6d8; font-size: 14px; letter-spacing: .2em; }
  @keyframes film-move { to { transform: translateX(-50%); } }

  /* ============ 3. 花瓣飘落 ============ */
  #s-petal { background: linear-gradient(180deg, #fdf1ec, #f8e3d6); }
  .petal {
    position: absolute; top: 18vh; width: 118px; background: #fff; padding: 6px 6px 22px;
    box-shadow: 0 8px 20px rgba(185,28,28,.15); border-radius: 3px;
    animation: petal-fall var(--dur) linear var(--delay) infinite;
  }
  /* 动画保险：静态默认位置在视口内，keyframes 冻结时依然可见 */
  .petal img { width: 100%; height: 85px; object-fit: cover; display: block; border-radius: 2px; }
  .petal .n { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--ink); }
  @keyframes petal-fall {
    0% { transform: translateY(-140px) translateX(0) rotate(0deg); opacity: 0; }
    8% { opacity: 1; }
    30% { transform: translateY(26vh) translateX(var(--sway)) rotate(80deg); }
    60% { transform: translateY(54vh) translateX(calc(var(--sway) * -.6)) rotate(200deg); }
    92% { opacity: 1; }
    100% { transform: translateY(104vh) translateX(var(--sway)) rotate(320deg); opacity: 0; }
  }
  [data-theme='white'] .petal { box-shadow: 0 8px 20px rgba(71,85,105,.18); }

  /* ============ 4. 九宫格祝福墙 ============ */
  /* 修复：display 不能写在 #s-wall（ID 特异性碾压 .scene 的 display:none，导致场景1/2/3 被它的不透明背景盖死） */
  #s-wall { background: linear-gradient(150deg, var(--bg), #f7e6d3); }
  #s-wall.on { display: flex; align-items: center; justify-content: center; }
  .wall { display: grid; grid-template-columns: repeat(3, min(21vw, 300px)); gap: 14px; perspective: 900px; }
  .wall-item { position: relative; width: 100%; height: 230px; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,.9,.3,1); }
  .wall-item.flip { transform: rotateY(180deg); }
  .wall-item .face {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .wall-item .back { background: var(--primary); color: #fff; font-size: 58px; }
  .wall-item .front { transform: rotateY(180deg); background: #fff; flex-direction: column; padding: 8px; }
  .wall-item .front img { width: 100%; height: 76%; object-fit: cover; border-radius: 6px; }
  .wall-item .front span { margin-top: 6px; font-size: 15px; color: var(--ink); }
  .wall.breathe { animation: wall-breath 1.6s ease-in-out 1; }
  @keyframes wall-breath { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }

  /* ============ 5. Ken Burns 大图 ============ */
  #s-kenburns { background: #000; }
  .kb-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
  .kb-slide.on { opacity: 1; }
  .kb-slide img { width: 100%; height: 100%; object-fit: cover; animation: kb-move 9s ease-in-out both; }
  @keyframes kb-move {
    0% { transform: scale(1.05) translate(0, 0); }
    100% { transform: scale(1.22) translate(-2.5%, -2%); }
  }
  .kb-name {
    position: absolute; right: 7%; bottom: 12%; writing-mode: vertical-rl; letter-spacing: .35em;
    font-size: clamp(34px, 5.4vh, 64px); color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.55); font-weight: 700;
  }
  .kb-sub { position: absolute; right: 8%; bottom: 6%; color: rgba(255,255,255,.85); font-size: 14px; letter-spacing: .2em; }
  .kb-fade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.45), transparent 45%); pointer-events: none; }

  /* ============ 6. 礼簿混排 ============ */
  #s-mixed { background: linear-gradient(160deg, var(--bg), #fdf0e8); padding: 4vh 0; }
  .mixed-frame {
    height: 100%; margin: 0 auto; max-width: 96vw; border: 3px solid var(--primary); outline: 1px solid var(--primary);
    outline-offset: 3px; background: #fff; overflow: hidden; position: relative;
  }
  .mixed-track { display: flex; height: 100%; width: max-content; will-change: transform; }
  .mixed-track > div { display: flex; height: 100%; } /* 中间容器必须显式 flex，否则格子垂直堆叠 */
  .mcell {
    flex: 0 0 auto; width: clamp(120px, 11vw, 190px); display: flex; flex-direction: column;
    padding: 14px 0 0; border-right: 1px solid #ecc8c4;
  }
  .mcell .cname { flex: 1; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: upright; letter-spacing: .3em; font-size: clamp(28px, 5vh, 54px); font-weight: 700; color: var(--ink); }
  .mcell .cd { height: 2px; background: var(--primary); opacity: .85; margin: 0 8px; }
  .mcell .clabel { flex: 0 0 auto; height: 64px; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; letter-spacing: .35em; font-size: 22px; font-weight: 700; color: var(--primary); }
  .mcell .camount { flex: 0 0 auto; height: 30%; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; font-size: 18px; color: var(--ink); letter-spacing: .2em; }
  .mcell .cnum { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 1px solid #ecc8c4; font-size: 16px; font-weight: 600; }
  .mcell .cnum small { font-size: 10px; font-weight: 400; color: var(--ink-soft); }
  /* 留影竖卡混在礼簿格里 */
  .mcell.photo .cname, .mcell.photo .clabel, .mcell.photo .camount { display: none; }
  .mcell.photo .pwrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 8px; gap: 6px; }
  .mcell.photo .pwrap img { width: 100%; flex: 1; min-height: 0; object-fit: cover; border-radius: 4px; border: 2px solid var(--soft); }
  .mcell.photo .pwrap b { font-size: 15px; color: var(--ink); }
  .mcell.photo .pbadge { background: var(--accent); color: #fff; font-size: 11px; padding: 1px 8px; border-radius: 999px; }

  .hint-bar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 98;
    background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 6px 14px; border-radius: 999px;
  }
</style>
</head>
<body>
<header>
  <h1 class="kai">囍 · 留影轮播原型</h1>
  <button class="tab on" data-s="polaroid">拍立得甩卡</button>
  <button class="tab" data-s="film">胶片流</button>
  <button class="tab" data-s="petal">花瓣飘落</button>
  <button class="tab" data-s="wall">九宫格祝福墙</button>
  <button class="tab" data-s="kenburns">Ken Burns 大图</button>
  <button class="tab" data-s="mixed">礼簿混排</button>
  <div class="auto">
    <button id="autoBtn" class="on">自动轮播演示：开</button>
    <button id="themeBtn" class="theme-sw">切换白事素雅版</button>
  </div>
</header>

<main>
  <section class="scene on" id="s-polaroid"><span class="scene-tag">玩法 1 · 拍立得甩卡：新留影“啪”地甩入中央，停留后旋入底部照片堆</span></section>
  <section class="scene" id="s-film"><span class="scene-tag">玩法 2 · 胶片流：黑底胶卷匀速滚动，复古质感</span></section>
  <section class="scene" id="s-petal"><span class="scene-tag">玩法 3 · 花瓣飘落：留影如花瓣旋落（白事主题自动换素雅纸鹤观感）</span></section>
  <section class="scene" id="s-wall"><span class="scene-tag">玩法 4 · 九宫格祝福墙：逐格翻牌点亮，集满呼吸换批</span></section>
  <section class="scene" id="s-kenburns"><span class="scene-tag">玩法 5 · Ken Burns：单图全屏电影感缓推，最安静高级</span></section>
  <section class="scene" id="s-mixed"><span class="scene-tag">玩法 6 · 礼簿混排：留影竖卡穿插礼簿竖格，风格一体</span></section>
</main>
<div class="hint-bar">原型演示 · 照片为 AI mock · 空格暂停/继续 · 数字 1-6 切换玩法</div>
<div id="errbar" style="display:none;position:fixed;left:12px;top:64px;z-index:999;max-width:86vw;background:#b91c1c;color:#fff;font:12px/1.5 monospace;padding:10px 14px;border-radius:10px;word-break:break-all"></div>
<noscript><div style="position:fixed;left:12px;top:64px;z-index:999;background:#b91c1c;color:#fff;padding:10px 14px;border-radius:10px">浏览器已禁用 JavaScript，本原型无法播放。请用 Chrome / Edge 打开。</div></noscript>
<script>
window.onerror = function (msg, src, line, col) {
  var bar = document.getElementById('errbar')
  if (bar) { bar.style.display = 'block'; bar.textContent = 'JS 错误: ' + msg + ' @' + line + ':' + col }
  return false
}
</script>

const AMOUNTS = ['捌佰元整','陆佰陆拾陆元整','壹仟贰佰元整','玖佰玖拾玖元整','贰佰元整','壹仟元整','叁佰陆拾陆元整','伍佰贰拾元整']
const NUMS = ['￥800.00','￥666.00','￥1,200.00','￥999.00','￥200.00','￥1,000.00','￥366.00','￥520.00']

/* ========== 场景切换 ========== */
let cur = 'polaroid'
const scenes = ['polaroid','film','petal','wall','kenburns','mixed']
function show(s) {
  cur = s
  scenes.forEach(k => {
    document.getElementById('s-' + k).classList.toggle('on', k === s)
    document.querySelector(`.tab[data-s="${k}"]`).classList.toggle('on', k === s)
  })
  stopCur()
  startCur()
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { show(t.dataset.s); autoOn = false; syncAuto() })

let autoOn = true
const autoBtn = document.getElementById('autoBtn')
function syncAuto() {
  autoBtn.textContent = '自动轮播演示：' + (autoOn ? '开' : '关')
  autoBtn.classList.toggle('on', autoOn)
}
autoBtn.onclick = () => { autoOn = !autoOn; syncAuto() }
setInterval(() => { if (autoOn) show(scenes[(scenes.indexOf(cur) + 1) % scenes.length]) }, 12000)

const themeBtn = document.getElementById('themeBtn')
themeBtn.onclick = () => {
  const el = document.documentElement
  const red = el.dataset.theme === 'red'
  el.dataset.theme = red ? 'white' : 'red'
  themeBtn.textContent = red ? '切换红事喜庆版' : '切换白事素雅版'
}

let paused = false
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused }
  const n = parseInt(e.key)
  if (n >= 1 && n <= 6) { show(scenes[n - 1]); autoOn = false; syncAuto() }
})

/* ========== 1. 拍立得甩卡 ========== */
let poTimer = []
function startPolaroid() {
  const scene = document.getElementById('s-polaroid')
  let i = 0, pile = 0
  function throwOne() {
    if (paused) return
    const p = PHOTOS[i % PHOTOS.length]
    const card = document.createElement('div')
    card.className = 'polaroid-card throw'
    card.innerHTML = `<img src="${p.src}"/><div class="cap kai">${p.name} · 婚宴留影</div>`
    card.style.left = '50%'
    scene.appendChild(card)
    setTimeout(() => {
      card.classList.remove('throw'); card.classList.add('settle')
      const rot = (Math.random() * 24 - 12).toFixed(1) + 'deg'
      const tx = (18 + (pile % 5) * 19 + Math.random() * 6) + 'vw'
      const ty = (28 + Math.floor(pile / 5) * 9 + Math.random() * 4) + 'vh'
      card.style.setProperty('--tx', `calc(-50% + ${tx})`)
      card.style.setProperty('--ty', ty)
      card.style.setProperty('--rot', rot)
      pile++
      if (pile >= 10) { pile = 0; scene.querySelectorAll('.polaroid-card').forEach(c => c.remove()); throwOne(); return }
      i++
    }, 2400)
    poTimer.push(setTimeout(throwOne, 3600))
  }
  throwOne()
}

/* ========== 2. 胶片流 ========== */
function startFilm() {
  const scene = document.getElementById('s-film')
  const half = () => PHOTOS.concat(PHOTOS).map((p, i) =>
    `<div class="film-cell"><img src="${p.src}"/><div class="who kai">${p.name} · 19:${30 + i} </div></div>`).join('')
  scene.insertAdjacentHTML('beforeend',
    `<div class="film-strip"><div class="film-half">${half()}</div><div class="film-half">${half()}</div></div>`)
}

/* ========== 3. 花瓣飘落 ========== */
function startPetal() {
  const scene = document.getElementById('s-petal')
  for (let k = 0; k < 12; k++) {
    const p = PHOTOS[k % PHOTOS.length]
    const el = document.createElement('div')
    el.className = 'petal'
    el.style.left = (4 + Math.random() * 88) + 'vw'
    el.style.setProperty('--dur', (7 + Math.random() * 5) + 's')
    el.style.setProperty('--delay', (Math.random() * 8) + 's')
    el.style.setProperty('--sway', (Math.random() * 140 - 70) + 'px')
    el.innerHTML = `<img src="${p.src}"/><div class="n kai">${p.name}</div>`
    scene.appendChild(el)
  }
}

/* ========== 4. 九宫格祝福墙 ========== */
let wallTimer = []
function startWall() {
  const scene = document.getElementById('s-wall')
  const wall = document.createElement('div')
  wall.className = 'wall'
  scene.appendChild(wall)
  let batch = 0
  function fill() {
    if (paused) { wallTimer.push(setTimeout(fill, 800)); return }
    wall.classList.remove('breathe')
    wall.innerHTML = ''
    for (let k = 0; k < 9; k++) {
      const p = PHOTOS[(batch * 9 + k) % PHOTOS.length]
      const it = document.createElement('div')
      it.className = 'wall-item'
      it.innerHTML = `<div class="face back kai">囍</div><div class="face front"><img src="${p.src}"/><span class="kai">${p.name}</span></div>`
      wall.appendChild(it)
      wallTimer.push(setTimeout(() => it.classList.add('flip'), 350 + k * 380))
    }
    wallTimer.push(setTimeout(() => { wall.classList.add('breathe') }, 350 + 9 * 380 + 1400))
    wallTimer.push(setTimeout(() => { batch++; fill() }, 350 + 9 * 380 + 3800))
  }
  fill()
}

/* ========== 5. Ken Burns ========== */
let kbTimer = []
function startKenburns() {
  const scene = document.getElementById('s-kenburns')
  let i = 0
  const slides = PHOTOS.concat(PHOTOS).map(p => {
    const d = document.createElement('div')
    d.className = 'kb-slide'
    d.innerHTML = `<img src="${p.src}"/><div class="kb-fade"></div><div class="kb-name kai">${p.name}</div><div class="kb-sub">婚宴留影 · 恭贺新囍</div>`
    scene.appendChild(d)
    return d
  })
  function next() {
    if (paused) { kbTimer.push(setTimeout(next, 500)); return }
    slides[i % slides.length].classList.remove('on')
    i++
    const s = slides[i % slides.length]
    const img = s.querySelector('img')
    img.style.animation = 'none'; void img.offsetWidth; img.style.animation = ''
    s.classList.add('on')
    kbTimer.push(setTimeout(next, 6000))
  }
  slides[0].classList.add('on')
  kbTimer.push(setTimeout(next, 6000))
}

/* ========== 6. 礼簿混排 ========== */
let mixedTimer = 0
function startMixed() {
  const scene = document.getElementById('s-mixed')
  const cells = []
  for (let k = 0; k < 12; k++) {
    if (k % 5 === 4) {
      const p = PHOTOS[(k / 5 | 0) % PHOTOS.length]
      cells.push(`<div class="mcell photo"><div class="pwrap"><span class="pbadge">留影祝福</span><img src="${p.src}"/><b class="kai">${p.name}</b></div><div class="cnum">${NUMS[k % 8]}<small>19:3${k}</small></div></div>`)
    } else {
      cells.push(`<div class="mcell"><div class="cname kai">${NAMES[k % NAMES.length].length === 2 ? NAMES[k % NAMES.length][0] + '　' + NAMES[k % NAMES.length][1] : NAMES[k % NAMES.length]}</div><div class="cd"></div><div class="clabel kai">贺礼</div><div class="cd"></div><div class="camount kai">${AMOUNTS[k % AMOUNTS.length]}</div><div class="cnum">${NUMS[k % NUMS.length]}<small>19:3${k}</small></div></div>`)
    }
  }
  scene.insertAdjacentHTML('beforeend',
    `<div class="mixed-frame"><div class="mixed-track"><div>${cells.join('')}</div><div>${cells.join('')}</div></div></div>`)
  const track = scene.querySelector('.mixed-track')
  let pos = 0, last = performance.now()
  function tick(now) {
    const dt = now - last; last = now
    if (!paused) {
      pos += dt * 0.048 * 0.55
      const half = track.scrollWidth / 2
      while (pos >= half) pos -= half
      track.style.transform = `translate3d(${-pos}px,0,0)`
    }
    mixedTimer = requestAnimationFrame(tick)
  }
  mixedTimer = requestAnimationFrame(tick)
}

/* ========== 生命周期 ========== */
function stopCur() {
  poTimer.forEach(clearTimeout); poTimer = []
  wallTimer.forEach(clearTimeout); wallTimer = []
  kbTimer.forEach(clearTimeout); kbTimer = []
  cancelAnimationFrame(mixedTimer)
  document.getElementById('s-polaroid').innerHTML = '<span class="scene-tag">玩法 1 · 拍立得甩卡：新留影“啪”地甩入中央，停留后旋入底部照片堆</span>'
  document.getElementById('s-film').innerHTML = '<span class="scene-tag">玩法 2 · 胶片流：黑底胶卷匀速滚动，复古质感</span>'
  document.getElementById('s-petal').innerHTML = '<span class="scene-tag">玩法 3 · 花瓣飘落：留影如花瓣旋落（白事主题自动换素雅纸鹤观感）</span>'
  document.getElementById('s-wall').innerHTML = '<span class="scene-tag">玩法 4 · 九宫格祝福墙：逐格翻牌点亮，集满呼吸换批</span>'
  document.getElementById('s-kenburns').innerHTML = '<span class="scene-tag">玩法 5 · Ken Burns：单图全屏电影感缓推，最安静高级</span>'
  document.getElementById('s-mixed').innerHTML = '<span class="scene-tag">玩法 6 · 礼簿混排：留影竖卡穿插礼簿竖格，风格一体</span>'
}
function startCur() {
  paused = false
  ;({ polaroid: startPolaroid, film: startFilm, petal: startPetal, wall: startWall, kenburns: startKenburns, mixed: startMixed })[cur]()
}
startCur()
</script>
